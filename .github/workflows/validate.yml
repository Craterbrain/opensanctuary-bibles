name: Validate
# The catalog must describe the files exactly (hashes, counts, licence), and the 66 canonical books
# must be present in order. Runs on every pull request and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py
